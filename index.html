<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 300px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #444;
            background-color: #222;
            color: #fff;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #ff4444;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #cc0000;
        }
        h2 { margin-bottom: 20px; color: #ff4444; }
        
        /* شاشة الاختراق */
        #hacked-screen {
            display: none;
            text-align: center;
        }
        #hacked-screen h1 {
            color: #ff4444;
            font-size: 2.5em;
        }
        #hacked-screen p {
            color: #aaa;
            font-size: 1.1em;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <!-- واجهة تسجيل الدخول -->
    <div class="card" id="login-card">
        <h2>تسجيل الدخول</h2>
        <form onsubmit="showHacked(event)">
            <input type="text" placeholder="اسم المستخدم" required>
            <input type="password" placeholder="كلمة المرور" required>
            <button type="submit">دخول</button>
        </form>
    </div>

    <!-- شاشة الاختراق المباشرة -->
    <div id="hacked-screen">
        <h1> تم اختراق جهازك بنجاح!</h1>
        <p>تم سحب جميع البيانات والملفات الشخصية بنجاح.</p>
    </div>

    <script>
        function showHacked(event) {
            event.preventDefault(); // يمنع إعادة تحميل الصفحة
            document.getElementById('login-card').style.display = 'none'; // يخفي خانة الدخول
            document.getElementById('hacked-screen').style.display = 'block'; // يظهر شاشة الاختراق فوراً
        }
    </script>

</body>
</html>
