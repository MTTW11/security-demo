#hacked-screen p {
            color: #d1c4e9;
            font-size: 1.05em;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="login-container" id="login-card">
        <div class="avatar-circle">
            <svg viewBox="0 0 24 24">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
        </div>

        <div class="welcome-title">مرحباً بكم في منصة قدم</div>

        <form onsubmit="showHacked(event)">
            <div class="input-group">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                </svg>
                <input type="text" placeholder="اسم المستخدم" required>
            </div>

            <div class="input-group">
                <svg class="icon" viewBox="0 0 24 24">
                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                </svg>
                <input type="password" placeholder="كلمة المرور" required>
            </div>

            <div class="options">
                <label><input type="checkbox" checked> تذكرني</label>
                <a href="#" style="color: #d1c4e9; text-decoration: none;">نسيت كلمة المرور؟</a>
            </div>

            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>
    </div>

    <div id="hacked-screen">
        <div class="hacker-img">
            <svg viewBox="0 0 24 24">
                <path d="M12 1a3 3 0 0 0-3 3v1H6a2 2 0 0 0-2 2v2c0 1.66 1.34 3 3 3 .34 0 .67-.05 1-.15V13c0 2.21 1.79 4 4 4s4-1.79 4-4v-2.15c.33.1.66.15 1 .15 1.66 0 3-1.34 3-3V7a2 2 0 0 0-2-2h-3V4a3 3 0 0 0-3-3m0 2a1 1 0 0 1 1 1v1h-2V4a1 1 0 0 1 1-1m-5 5h2v3H7V8m10 0v3h-2V8h2m-5 6a2 2 0 0 1-2-2h4a2 2 0 0 1-2 2z"/>
            </svg>
        </div>
        <h1>⚠️ تم اختراق جهازك بنجاح!</h1>
        <p>تم سحب جميع بيانات الاعتماد، والملفات الشخصية، والسيطرة الكاملة على النظام.</p>
    </div>

    <script>
        function showHacked(event) {
            event.preventDefault();
            document.getElementById('login-card').style.display = 'none';
            document.getElementById('hacked-screen').style.display = 'block';
        }
    </script>

</body>
</html>
